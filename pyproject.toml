[project]
name = "swarmr-blame"
version = "1.0.0"
description = "Git archaeology team for swarmr: which commit broke the test, and proof."
readme = "README.md"
requires-python = ">=3.13"
# The team owns its SDK. `swarmr` is capped to a minor because `Team`,
# `RunContext`, `TeamBuild` and the `swarmr.teams` entry-point group are an ABI
# this package implements; a minor bump may move them.
dependencies = [
  "swarmr>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1"]

# The one line that makes this package a team. `swarmr` reads this group from
# installed distribution metadata and imports nothing until the team is run.
[project.entry-points."swarmr.teams"]
repo_forensics = "swarmr_blame:TEAM"

[project.urls]
Homepage = "https://github.com/codectl/swarmr-blame"
Source = "https://github.com/codectl/swarmr-blame"
Issues = "https://github.com/codectl/swarmr-blame/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmr_blame"]
# Tests live beside the code they test; they are not part of the installed
# package.
exclude = ["**/tests"]

[tool.pyright]
# venvPath/venv is the only project-level signal an editor's pyright reads, and
# without it the language server type-checks against whatever interpreter is on
# PATH. CI therefore builds `.venv` too, so this one path is correct everywhere.
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
include = ["src"]
exclude = [".venv", "**/__pycache__"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-q --strict-markers --import-mode=importlib"

[tool.ruff]
line-length = 90
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
